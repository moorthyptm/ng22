<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-4">Signal Forms</h1>

  <div class="flex w-full gap-8 md:flex-row flex-col">
    <form class="space-y-4 flex-1" [formRoot]="testForm">
      <div class="flex flex-col">
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input
          type="text"
          id="name"
          [formField]="testForm.name"
          placeholder="Enter your name"
          class="px-3 py-2 border border-gray-300 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="flex flex-col">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          id="email"
          [formField]="testForm.email"
          placeholder="Enter your email"
          class="px-3 py-2 border border-gray-300 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="flex flex-col">
        <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
        <textarea
          id="message"
          [formField]="testForm.message"
          placeholder="Enter your message"
          class="px-3 py-2 border border-gray-300 rounded-md w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
        ></textarea>
      </div>
      <button
        type="submit"
        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        Submit
      </button>
    </form>

    <div class="w-px bg-gray-300"></div>

    <div class="ml-8 flex-1">
      <h2 class="text-2xl font-bold mb-4">Form Data</h2>
      <pre class="bg-gray-100 p-4 rounded-md"
        >{{ formModel() | json }}
    </pre
      >
    </div>
  </div>
</div>
